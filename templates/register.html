<!DOCTYPE html>
<html>
<head>
    <title>PrepScore Register</title>
</head>
<body>

    <h1>Register</h1>

    <form method="POST">

        <label>Name</label>
        <input type="text" name="name" required>

        <br><br>

        <label>Email</label>
        <input type="email" name="email" required>

        <br><br>

        <label>Password</label>
        <input type="password" name="password" required>

        <br><br>

        <button type="submit">
            Register
        </button>

    </form>

</body>
</html>
